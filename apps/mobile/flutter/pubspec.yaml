name: novyn
description: A premium chat application built with Flutter.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.2.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  socket_io_client: ^2.0.3
  provider: ^6.0.5
  google_fonts: ^8.1.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.1
  path: ^1.8.3
  shimmer: ^3.0.0
  image_picker: ^1.0.7
  http: ^1.2.1
  audioplayers: ^6.0.0
  flutter_webrtc: ^1.4.1
  flutter_slidable: ^3.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  permission_handler: ^11.3.1
  local_auth: ^3.0.1
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  drift_dev: ^2.14.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/icons/
