<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page Not Found — Novyn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0a0f1a;
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      color: #00C97A;
    }

    .logo-name {
      font-size: 20px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: -0.3px;
    }

    .error-code {
      font-size: 72px;
      font-weight: 300;
      color: #00C97A;
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #00C97A;
      color: #0a0f1a;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.88; }

    .divider {
      width: 40px;
      height: 2px;
      background: rgba(0,201,122,0.3);
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      .error-code { font-size: 56px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">
      <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="7" stroke-opacity="0.12"/>
        <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2.5" stroke-dasharray="28 85" stroke-linecap="round" fill="none"/>
        <circle cx="24" cy="24" r="10" stroke="currentColor" stroke-width="1.8" stroke-dasharray="14 50" stroke-linecap="round" fill="none" opacity="0.5"/>
        <circle cx="24" cy="24" r="3" fill="currentColor"/>
      </svg>
      <span class="logo-name">Novyn</span>
    </a>

    <div class="error-code">404</div>
    <div class="divider"></div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have been moved. Check the URL or head back home.</p>

    <a href="/" class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Back to Novyn
    </a>
  </div>
</body>
</html>
