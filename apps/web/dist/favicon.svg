<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6cff" />
      <stop offset="100%" stop-color="#5141cd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3f33a6" flood-opacity="0.42"/>
    </filter>
  </defs>
  
  <!-- Rounded Badge -->
  <rect width="100" height="100" rx="24" fill="url(#badgeGrad)" />
  
  <!-- White Wings Center -->
  <image href="data:image/png;base64," x="12" y="12" width="76" height="76" filter="url(#glow)" />
</svg>
