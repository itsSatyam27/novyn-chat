name: Novyn Shorebird OTA

on:
  workflow_dispatch:
    inputs:
      action:
        description: Create the first Shorebird release or publish a Dart patch
        required: true
        type: choice
        options:
          - release
          - patch
      release_version:
        description: Existing Shorebird release version for patch mode (for example 1.0.0+42)
        required: false
        type: string
      track:
        description: Patch track
        required: true
        type: choice
        default: staging
        options:
          - staging
          - stable
          - beta

permissions:
  contents: write

jobs:
  shorebird:
    name: Shorebird Android ${{ inputs.action }}
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Shorebird project setup
        run: |
          set -euo pipefail
          if [ ! -f apps/mobile/flutter/shorebird.yaml ]; then
            echo "::error::Missing apps/mobile/flutter/shorebird.yaml. Run 'shorebird init' in apps/mobile/flutter and commit the generated file first."
            exit 1
          fi
          if [ -z "${SHOREBIRD_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret SHOREBIRD_TOKEN."
            exit 1
          fi
          if [ "${{ inputs.action }}" = "patch" ] && [ -z "${{ inputs.release_version }}" ]; then
            echo "::error::Enter release_version when action is patch."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Restore Firebase configuration
        working-directory: apps/mobile/flutter
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_SERVICES_JSON"
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null

      - name: Restore Android release signing key
        if: inputs.action == 'release'
        working-directory: apps/mobile/flutter/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret ${name}"
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/novyn-upload-key.jks
          cat > key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=novyn-upload-key.jks
          EOF

      - name: Create Shorebird Android release
        if: inputs.action == 'release'
        uses: shorebirdtech/shorebird-release@v1
        with:
          flutter-version: 3.47.9
          platform: android
          working-directory: apps/mobile/flutter
          args: --artifact=apk --build-number=${{ github.run_number }}

      - name: Upload Shorebird release APK
        if: inputs.action == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: novyn-shorebird-release-${{ github.run_number }}
          path: apps/mobile/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Shorebird patch
        if: inputs.action == 'patch'
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          working-directory: apps/mobile/flutter
          release-version: ${{ inputs.release_version }}
          track: ${{ inputs.track }}
