name: Novyn Optimized ARM64 APK

on:
  push:
    branches: [phase-2, main]
    paths:
      - "apps/mobile/flutter/**"
      - ".github/workflows/optimized-arm64-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

# Serialize main-branch releases so an older parallel build cannot publish last.
concurrency:
  group: novyn-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build optimized ARM64 Shorebird release APK
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Shorebird project setup
        run: |
          set -euo pipefail
          test -f apps/mobile/flutter/shorebird.yaml || (echo "::error::Missing apps/mobile/flutter/shorebird.yaml" && exit 1)
          test -n "${SHOREBIRD_TOKEN}" || (echo "::error::Missing SHOREBIRD_TOKEN secret" && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Restore Firebase configuration
        working-directory: apps/mobile/flutter
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICES_JSON}" || (echo "::error::Missing GOOGLE_SERVICES_JSON secret" && exit 1)
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null

      - name: Restore Android release signing key
        working-directory: apps/mobile/flutter/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret ${name}"
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/novyn-upload-key.jks
          cat > key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=novyn-upload-key.jks
          EOF

      - name: Install Flutter dependencies
        working-directory: apps/mobile/flutter
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile/flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Generate monotonic Android build code
        id: build-meta
        run: |
          set -euo pipefail
          BUILD_CODE="$(date -u +%s)"
          echo "build_code=${BUILD_CODE}" >> "${GITHUB_OUTPUT}"
          echo "Novyn Android build code: ${BUILD_CODE}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create ARM64 Shorebird release
        uses: shorebirdtech/shorebird-release@v1
        id: shorebird-release
        with:
          flutter-version: 3.47.9
          platform: android
          working-directory: apps/mobile/flutter
          args: >-
            --artifact=apk
            --build-number=${{ steps.build-meta.outputs.build_code }}
            --
            --target-platform=android-arm64

      - name: Verify ARM64 APK package and signature
        id: apk-verify
        run: |
          set -euo pipefail
          APK="apps/mobile/flutter/build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "${APK}"
          BADGING="$("${BUILD_TOOLS}/aapt" dump badging "${APK}")"
          grep -F "package: name='com.example.novyn'" <<< "${BADGING}"
          grep -F "versionName='1.0.0-beta'" <<< "${BADGING}"
          VERSION_CODE="$(sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" <<< "${BADGING}" | head -n 1)"
          test -n "${VERSION_CODE}"
          test "${VERSION_CODE}" -gt 0
          test "${VERSION_CODE}" -lt 2100000000
          echo "apk_version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          unzip -t "${APK}" >/dev/null
          unzip -Z1 "${APK}" | grep -q '^lib/arm64-v8a/'
          NON_ARM64_LIBS="$(unzip -Z1 "${APK}" | grep -E '^lib/[^/]+/' | grep -v '^lib/arm64-v8a/' || true)"
          test -z "${NON_ARM64_LIBS}"
          echo "ARM64-only Shorebird APK package, version, ZIP structure, and signature verified." >> "${GITHUB_STEP_SUMMARY}"

      - name: Report ARM64 APK size
        id: apk-size
        run: |
          set -euo pipefail
          APK="apps/mobile/flutter/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk -v bytes="$BYTES" 'BEGIN { printf "%.1f", bytes / 1048576 }')
          echo "size_mib=$MIB" >> "$GITHUB_OUTPUT"
          {
            echo "## Novyn ARM64 APK"
            echo ""
            echo "- File: Novyn-Android-ARM64.apk"
            echo "- Size: **${MIB} MiB**"
            echo "- Build: ${GITHUB_RUN_NUMBER}"
            echo "- Shorebird release: ${{ steps.shorebird-release.outputs.release-version }}"
            echo "- OTA patches: enabled for compatible Dart-code changes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct ARM64 APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_APK="apps/mobile/flutter/build/app/outputs/flutter-apk/app-release.apk"
          RELEASE_DIR="release-assets"
          RELEASE_APK="${RELEASE_DIR}/Novyn-Android-ARM64.apk"
          mkdir -p "${RELEASE_DIR}"
          cp "${SOURCE_APK}" "${RELEASE_APK}"
          # Read the actual versionCode embedded in the signed APK. Never
          # derive release metadata from a separate timestamp that can race.
          BUILD_CODE="${{ steps.apk-verify.outputs.apk_version_code }}"
          TAG="novyn-arm64-build-${BUILD_CODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          MB=$(awk -v bytes="$(stat -c%s "${RELEASE_APK}")" 'BEGIN { printf "%.1f", bytes / 1000000 }')
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            RELEASE_CHANNEL_ARGS=(--latest)
          else
            RELEASE_CHANNEL_ARGS=(--prerelease)
          fi
          gh release create "${TAG}" "${RELEASE_APK}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Novyn Android ARM64 APK — ${MB} MB" \
            --notes "Signed ARM64-v8a Android release APK with Shorebird OTA enabled for compatible Dart-code updates. Direct download; no ZIP extraction required." \
            "${RELEASE_CHANNEL_ARGS[@]}"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: novyn-arm64-release-apk
          path: apps/mobile/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
