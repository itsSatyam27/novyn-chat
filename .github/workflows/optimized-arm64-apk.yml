name: Novyn Optimized ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build optimized ARM64 release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Restore Firebase configuration
        working-directory: apps/mobile/flutter
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICES_JSON}" || (echo "::error::Missing GOOGLE_SERVICES_JSON secret" && exit 1)
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null

      - name: Restore Android release signing key
        working-directory: apps/mobile/flutter/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret ${name}"
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/novyn-upload-key.jks
          cat > key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=novyn-upload-key.jks
          EOF

      - name: Install Flutter dependencies
        working-directory: apps/mobile/flutter
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile/flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build split release APKs
        working-directory: apps/mobile/flutter
        run: flutter build apk --release --split-per-abi --build-number="${GITHUB_RUN_NUMBER}"

      - name: Report ARM64 APK size
        id: apk-size
        run: |
          set -euo pipefail
          APK="apps/mobile/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk -v bytes="$BYTES" 'BEGIN { printf "%.1f", bytes / 1048576 }')
          echo "size_mib=$MIB" >> "$GITHUB_OUTPUT"
          {
            echo "## Novyn ARM64 APK"
            echo ""
            echo "- File: `app-arm64-v8a-release.apk`"
            echo "- Size: **${MIB} MiB**"
            echo "- Build: ${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct ARM64 APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_APK="apps/mobile/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          RELEASE_DIR="release-assets"
          RELEASE_APK="${RELEASE_DIR}/Novyn-Android-ARM64.apk"
          mkdir -p "${RELEASE_DIR}"
          cp "${SOURCE_APK}" "${RELEASE_APK}"
          TAG="novyn-arm64-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          MB=$(awk -v bytes="$(stat -c%s "${RELEASE_APK}")" 'BEGIN { printf "%.1f", bytes / 1000000 }')
          gh release create "${TAG}" "${RELEASE_APK}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Novyn Android ARM64 APK — ${MB} MB" \
            --notes "Signed ARM64-v8a Android release APK. Direct download; no ZIP extraction required."

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: novyn-arm64-release-apk
          path: apps/mobile/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
