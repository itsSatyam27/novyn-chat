name: Novyn CI

on:
  push:
    branches: [main, "phase-2", "features/**", "hardening/**", "calls/**", "offline/**"]
  pull_request:
    branches: [main, "phase-2"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check apps/api/server.js
      - run: npm test
      - run: npm run build

  flutter-validate:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile/flutter
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: apps/mobile/flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run dock widget tests
        working-directory: apps/mobile/flutter
        run: flutter test --no-pub test/novyn_dock_test.dart test/novyn_alert_test.dart test/quick_toggle_preferences_test.dart test/quick_toggle_layout_test.dart test/rtc_ice_configuration_test.dart test/pending_message_queue_test.dart test/message_pagination_test.dart test/smart_presence_policy_test.dart test/last_seen_presence_test.dart test/media_download_queue_test.dart test/profile_deep_link_service_test.dart

  android-release-compile:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/phase-2' || startsWith(github.ref, 'refs/heads/hardening/') || startsWith(github.ref, 'refs/heads/calls/') || startsWith(github.ref, 'refs/heads/offline/'))
    name: Android release APK compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Android NDK (retry corrupted downloads)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "::error::Android SDK root was not provided by the runner"
            exit 1
          fi
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "::error::Android sdkmanager was not found"
            exit 1
          fi
          NDK_VERSION="28.2.13676358"
          NDK_DIR="${SDK_ROOT}/ndk/${NDK_VERSION}"
          if [[ -f "${NDK_DIR}/source.properties" ]]; then
            echo "Android NDK ${NDK_VERSION} is already installed"
            exit 0
          fi
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            echo "Installing Android NDK ${NDK_VERSION} (attempt ${attempt}/3)"
            rm -rf "${NDK_DIR}" "${SDK_ROOT}/.temp" "${HOME}/.android/cache"
            if "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "ndk;${NDK_VERSION}"; then
              if [[ -f "${NDK_DIR}/source.properties" ]]; then
                echo "Android NDK ${NDK_VERSION} installed successfully"
                cat "${NDK_DIR}/source.properties"
                exit 0
              fi
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Could not install Android NDK ${NDK_VERSION} after 3 attempts"
          exit 1
      - name: Restore Firebase configuration
        working-directory: apps/mobile/flutter
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_SERVICES_JSON"
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
      - name: Restore Android release signing key
        working-directory: apps/mobile/flutter/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret ${name}"
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/novyn-upload-key.jks
          cat > key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=novyn-upload-key.jks
          EOF
      - name: Install Flutter dependencies
        working-directory: apps/mobile/flutter
        run: flutter pub get
      - name: Compile Android release APK
        working-directory: apps/mobile/flutter
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number="${GITHUB_RUN_NUMBER}"
      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: Novyn-Android-ARM64
          path: apps/mobile/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
