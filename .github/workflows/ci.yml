name: Novyn CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check apps/api/server.js
      - run: npm test
      - run: npm run build

  flutter-validate:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile/flutter
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: apps/mobile/flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
