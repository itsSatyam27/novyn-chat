name: Novyn CI

on:
  push:
    branches: [main, "phase-2", "features/**", "hardening/**", "calls/**", "offline/**"]
  pull_request:
    branches: [main, "phase-2"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check apps/api/server.js
      - run: npm test
      - run: npm run build

  flutter-validate:
    name: Phase 2 Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Phase 2 Flutter dependencies
        working-directory: apps/mobile/flutter
        run: flutter pub get
      - name: Analyze Phase 2 Flutter client
        working-directory: apps/mobile/flutter
        run: flutter analyze --no-pub
      - name: Run Phase 2 widget tests
        working-directory: apps/mobile/flutter
        run: flutter test --no-pub

  android-release-compile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/phase-2'
    name: Fresh Phase 2 Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Generate clean Android platform scaffolding
        shell: bash
        run: |
          set -euo pipefail
          SCAFFOLD_DIR="$(mktemp -d)"
          rmdir "${SCAFFOLD_DIR}"
          flutter create --platforms=android --project-name novyn --org com.novyn --no-pub "${SCAFFOLD_DIR}"
          cp -a "${SCAFFOLD_DIR}/android" apps/mobile/flutter/android
          rm -rf "${SCAFFOLD_DIR}"
      - name: Install Android NDK (retry corrupted downloads)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "::error::Android SDK root was not provided by the runner"
            exit 1
          fi
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "::error::Android sdkmanager was not found"
            exit 1
          fi
          NDK_VERSION="28.2.13676358"
          NDK_DIR="${SDK_ROOT}/ndk/${NDK_VERSION}"
          if [[ -f "${NDK_DIR}/source.properties" ]]; then
            echo "Android NDK ${NDK_VERSION} is already installed"
            exit 0
          fi
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            echo "Installing Android NDK ${NDK_VERSION} (attempt ${attempt}/3)"
            rm -rf "${NDK_DIR}" "${SDK_ROOT}/.temp" "${HOME}/.android/cache"
            if "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "ndk;${NDK_VERSION}"; then
              if [[ -f "${NDK_DIR}/source.properties" ]]; then
                echo "Android NDK ${NDK_VERSION} installed successfully"
                cat "${NDK_DIR}/source.properties"
                exit 0
              fi
            fi
            if [[ "${attempt}" -lt 3 ]]; then sleep "$((attempt * 10))"; fi
          done
          echo "::error::Could not install Android NDK ${NDK_VERSION} after 3 attempts"
          exit 1
      - name: Install Phase 2 Flutter dependencies
        working-directory: apps/mobile/flutter
        run: flutter pub get
      - name: Compile clean ARM64 release APK
        working-directory: apps/mobile/flutter
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number="${GITHUB_RUN_NUMBER}"
      - name: Upload Phase 2 ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Novyn-Phase2-ARM64
          path: apps/mobile/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
