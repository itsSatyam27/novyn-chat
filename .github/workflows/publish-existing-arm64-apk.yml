name: Publish Existing Novyn ARM64 APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-existing-arm64-apk.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish existing 49.6 MB ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified ARM64 APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 43574693729 \
            --repo "${GITHUB_REPOSITORY}" \
            --name "novyn-arm64-release-apk" \
            --dir release-assets
          SOURCE_APK="release-assets/app-arm64-v8a-release.apk"
          test -s "${SOURCE_APK}"
          # Validate the ZIP/APK container signature before publishing.
          test "$(od -An -tx1 -N2 "${SOURCE_APK}" | tr -d ' \n')" = "504b"
          cp "${SOURCE_APK}" "release-assets/Novyn-Android-ARM64.apk"

      - name: Create public direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="release-assets/Novyn-Android-ARM64.apk"
          TAG="novyn-arm64-49mb-2026-11-14"
          MIB=$(awk -v bytes="$(stat -c%s "${APK}")" 'BEGIN { printf "%.1f", bytes / 1048576 }')
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${APK}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Novyn Android ARM64 APK — ${MIB} MB" \
              --notes "Signed Android ARM64-v8a APK. Direct APK download; no ZIP extraction is required. Built by GitHub Actions from commit c594fe2."
          fi
          echo "Published ${MIB} MiB APK as Novyn-Android-ARM64.apk"
