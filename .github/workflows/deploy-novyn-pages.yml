name: Deploy Novyn Landing Page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "index.html"
      - "styles.css"
      - "script.js"
      - "novyn-mark.svg"
      - ".nojekyll"
      - ".github/workflows/deploy-novyn-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "novyn-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean website files
        run: |
          mkdir -p _site
          cp landing/index.html landing/styles.css landing/script.js landing/novyn-mark.svg _site/
          touch _site/.nojekyll

      - name: Upload landing website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
