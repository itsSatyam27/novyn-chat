# Firebase Hosting live deploy on merge to main

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Firebase service account secret
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHAT_NOVYN }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_CHAT_NOVYN is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "$SA_JSON" | python3 -m json.tool > /dev/null || {
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_CHAT_NOVYN is not valid JSON. Re-generate the service account key from Firebase Console."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync root landing page to public
        run: cp index.html public/index.html

      - run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHAT_NOVYN }}
          channelId: live
          projectId: chat-novyn
