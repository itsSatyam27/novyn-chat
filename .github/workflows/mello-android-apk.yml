name: Mello Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - phase-2
    paths:
      - "apps/mobile/mello/**"
      - ".github/workflows/mello-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: mello-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Mello ARM64 release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: apps/mobile/mello
        run: flutter create --platforms=android --org com.mello.chat --project-name mello .

      - name: Install Flutter dependencies
        working-directory: apps/mobile/mello
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile/mello
        run: flutter analyze --no-pub

      - name: Build ARM64 release APK
        working-directory: apps/mobile/mello
        run: flutter build apk --release --target-platform=android-arm64 --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload Mello APK
        uses: actions/upload-artifact@v4
        with:
          name: mello-android-arm64-apk
          path: apps/mobile/mello/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
