name: Novyn Shorebird Auto Patch

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/flutter/lib/**/*.dart"
      - ".github/workflows/shorebird-auto-patch.yml"

permissions:
  contents: read

concurrency:
  group: novyn-shorebird-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: Publish stable Android ARM64 patch
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      SHOREBIRD_RELEASE_VERSION: ${{ vars.SHOREBIRD_RELEASE_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm push contains only Dart source changes
        id: change-scope
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Cannot determine the previous commit for this push."
            exit 1
          fi
          CHANGED_FILES="$(git diff --name-only "${PUSH_BEFORE}" "${GITHUB_SHA}")"
          if [ -z "${CHANGED_FILES}" ]; then
            echo "::error::No changed files found for this push."
            exit 1
          fi
          NON_DART_RUNTIME_FILES="$(printf '%s\\n' "${CHANGED_FILES}" | grep '^apps/mobile/flutter/' | grep -Ev '^apps/mobile/flutter/lib/.+\\.dart$|^apps/mobile/flutter/test/|^apps/mobile/flutter/README\\.md$' || true)"
          if [ -n "${NON_DART_RUNTIME_FILES}" ]; then
            echo "Skipping OTA patch because this push includes Flutter platform, asset, or dependency changes:"
            printf '%s\\n' "${NON_DART_RUNTIME_FILES}"
            echo "dart_only=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "dart_only=true" >> "${GITHUB_OUTPUT}"

      - name: Verify Shorebird configuration
        if: steps.change-scope.outputs.dart_only == 'true'
        run: |
          set -euo pipefail
          test -f apps/mobile/flutter/shorebird.yaml || (echo "::error::Missing apps/mobile/flutter/shorebird.yaml" && exit 1)
          test -n "${SHOREBIRD_TOKEN}" || (echo "::error::Missing SHOREBIRD_TOKEN repository secret" && exit 1)
          test -n "${SHOREBIRD_RELEASE_VERSION}" || (echo "::error::Missing SHOREBIRD_RELEASE_VERSION repository variable. Set it to the installed ARM64 Shorebird release version." && exit 1)

      - name: Set up Java
        if: steps.change-scope.outputs.dart_only == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Shorebird
        if: steps.change-scope.outputs.dart_only == 'true'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Restore Firebase configuration
        if: steps.change-scope.outputs.dart_only == 'true'
        working-directory: apps/mobile/flutter
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICES_JSON}" || (echo "::error::Missing GOOGLE_SERVICES_JSON secret" && exit 1)
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null

      - name: Restore Android release signing key
        if: steps.change-scope.outputs.dart_only == 'true'
        working-directory: apps/mobile/flutter/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret ${name}"
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/novyn-upload-key.jks
          cat > key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=novyn-upload-key.jks
          EOF

      - name: Publish stable ARM64 patch
        id: shorebird-patch
        if: steps.change-scope.outputs.dart_only == 'true'
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          working-directory: apps/mobile/flutter
          release-version: ${{ vars.SHOREBIRD_RELEASE_VERSION }}
          track: stable
          args: --allow-asset-diffs

      - name: Summarize patch
        if: steps.change-scope.outputs.dart_only == 'true'
        run: |
          {
            echo "## Shorebird stable patch published"
            echo ""
            echo "- Release: ${SHOREBIRD_RELEASE_VERSION}"
            echo "- Patch: ${{ steps.shorebird-patch.outputs.patch-number }}"
            echo "- Track: stable"
            echo "- Trigger commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
