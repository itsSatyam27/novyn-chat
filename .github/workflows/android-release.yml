name: Novyn Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase configuration
        working-directory: apps/mobile/flutter
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_SERVICES_JSON"
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null

      - name: Restore Android release signing key
        working-directory: apps/mobile/flutter/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret ${name}"
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/novyn-upload-key.jks
          cat > key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=novyn-upload-key.jks
          EOF

      - name: Install Flutter dependencies
        working-directory: apps/mobile/flutter
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile/flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build signed release APK
        working-directory: apps/mobile/flutter
        run: flutter build apk --release --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: novyn-release-apk
          path: apps/mobile/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
