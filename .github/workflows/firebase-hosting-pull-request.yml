# Firebase Hosting preview deploy on pull requests

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Firebase service account secret
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOVYN_CHAT_APP }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_NOVYN_CHAT_APP is not set."
            exit 1
          fi
          echo "$SA_JSON" | python3 -m json.tool > /dev/null || {
            echo "::error::Firebase service account secret is not valid JSON."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci && npm run build

      # The Firebase Hosting preview-channel quota can be exhausted. Treat that
      # specific platform limitation as a warning, while failing other deploy errors.
      - name: Deploy Firebase preview (quota-aware)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOVYN_CHAT_APP }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools hosting:channel:deploy "pr${{ github.event.pull_request.number }}" --expires 7d --project novyn-chat-app --debug > "$RUNNER_TEMP/firebase-deploy.log" 2>&1 || {
            if grep -Eqi 'channel quota reached|RESOURCE_EXHAUSTED|HTTP Error: 429' "$RUNNER_TEMP/firebase-deploy.log"; then
              echo "::warning::Firebase Hosting preview channel quota is exhausted; build passed but preview was not deployed."
              tail -n 30 "$RUNNER_TEMP/firebase-deploy.log"
            else
              cat "$RUNNER_TEMP/firebase-deploy.log"
              exit 1
            fi
          }
