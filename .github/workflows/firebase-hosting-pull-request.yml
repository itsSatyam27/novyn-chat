# Firebase Hosting preview deploy on pull requests

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Firebase service account secret
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOVYN_CHAT_APP }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_NOVYN_CHAT_APP is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "$SA_JSON" | python3 -m json.tool > /dev/null || {
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_NOVYN_CHAT_APP is not valid JSON. Re-generate the service account key from Firebase Console."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci && npm run build

      - name: Deploy Firebase preview (non-blocking on Hosting quota limits)
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOVYN_CHAT_APP }}
          projectId: novyn-chat-app
