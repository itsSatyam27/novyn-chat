name: Deploy Novyn Firebase Admin Monitor

on:
  push:
    branches: [main]
    paths:
      - "public/admin/**"
      - ".github/workflows/firebase-admin-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novyn-firebase-admin-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHAT_NOVYN }}
          channelId: live
          projectId: chat-novyn
